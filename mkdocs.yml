site_name: Cryptography
site_url: https://ttmathcs.github.io/cryptography/
site_description: Modern cryptography by category, with standards, release years and status
repo_url: https://github.com/TTMathCS/cryptography
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight
    - content.code.copy
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font: false

extra_css:
  - fonts/fonts.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/status.js
  - path: holidays/badge.js
    type: module

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Key exchange:
      - 01-key-exchange/Diffie-Hellman.md
      - 01-key-exchange/ECDH.md
      - 01-key-exchange/ML-KEM.md
  - Signatures:
      - 02-signatures/RSA.md
      - 02-signatures/DSA.md
      - 02-signatures/ECDSA.md
      - 02-signatures/EdDSA.md
      - 02-signatures/ML-DSA.md
  - Symmetric ciphers:
      - 04-symmetric-ciphers/AES.md
  - Modes and AEAD:
      - 05-modes-aead/AEAD.md
  - MAC:
      - 06-mac/HMAC.md
  - Hash functions:
      - 07-hash/SHA-2.md
      - 07-hash/SHA-3.md
  - KDF and password hashing:
      - 08-kdf-password-hashing/HKDF.md
      - 08-kdf-password-hashing/Argon2.md
      - 08-kdf-password-hashing/scrypt.md
      - 08-kdf-password-hashing/bcrypt.md
      - 08-kdf-password-hashing/PBKDF2.md
  - Math foundations:
      - 10-math-foundations/Sieve-of-Eratosthenes.md
      - 10-math-foundations/Miller-Rabin-Primality-Test.md
      - 10-math-foundations/Baillie-PSW-Primality-Test.md
      - 10-math-foundations/Pocklington-Primality-Test.md
      - 10-math-foundations/Mersenne-Primes.md
      - 10-math-foundations/Fermat-Primes.md
  - Protocols:
      - protocols/index.md
      - protocols/SSH.md
      - protocols/TLS-1.3.md
      - protocols/PKI.md
  - FAQ: FAQ.md
