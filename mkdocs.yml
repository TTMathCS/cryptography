site_name: Cryptography
site_url: https://cryptography.akadian.ca/
site_description: Modern cryptography by category, with standards, release years and status
repo_url: https://github.com/TTMathCS/cryptography
edit_uri: edit/main/docs/
copyright: 'Part of <a href="https://www.akadian.ca/">Mars – your new home</a>'

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunset-up
        name: Mars dawn
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mars night
  font: false

extra_css:
  - fonts/fonts.css
  - stylesheets/mars.css
  - stylesheets/ask.css

extra:
  homepage: https://www.akadian.ca/

extra_javascript:
  - javascripts/status.js
  - javascripts/mars-link.js
  - javascripts/home-link.js
  - javascripts/ask.js
  - path: holidays/badge.js
    type: module

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences

# With --strict, a broken link or #anchor stops the build
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

