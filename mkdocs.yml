site_name: Cryptography
site_url: https://cryptography.akadian.ca/
site_description: A cryptography tutorial from the first ciphers to post-quantum, with the history, the math and the standards of every algorithm
repo_url: https://github.com/TTMathCS/cryptography
edit_uri: edit/main/docs/
copyright: 'Part of <a href="https://www.akadian.ca/">Mars – your new home</a>'

theme:
  name: material
  custom_dir: overrides
  favicon: assets/akadian-icon.png   # the Akadian A, as on akadian.ca
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Light colours
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark colours
  font: false

extra_css:
  - fonts/fonts.css
  - stylesheets/mars.css
  - stylesheets/ask.css
  - stylesheets/reader.css
  - stylesheets/sketch.css
  - stylesheets/play.css
  - katex/katex.min.css

extra:
  homepage: https://www.akadian.ca/

extra_javascript:
  - https://www.akadian.ca/schools.js   # the Mars Schools row: links to every other school site; its one list is the Mars Schools section of Mars-Requirements site/menu.md (Mars-Home schools.js, written by Mars-Build tools/menu.py)
  - https://www.akadian.ca/home-music.js?site   # the song from www.akadian.ca: it goes on here while it plays (Mars-Home home-music.js)
  - javascripts/status.js
  - javascripts/mars-link.js
  - javascripts/home-link.js
  - javascripts/ask.js
  - javascripts/modexp.js
  - javascripts/steps.js
  - javascripts/timeline-sort.js
  - katex/katex.min.js
  - katex/auto-render.min.js
  - javascripts/math.js
  - javascripts/levels.js
  - javascripts/reader.js
  - javascripts/play.js
  - javascripts/levelcheck.js
  - path: holidays/badge.js
    type: module

hooks:
  - hooks/standard_links.py

markdown_extensions:
  - toc:
      permalink: true
      title: On this page
  - tables
  - admonition
  - pymdownx.details
  - md_in_html
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

# With --strict, a broken link or #anchor stops the build
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# The book first, then the appendices. The old lessons in learn/ forward to their chapters.
not_in_nav: |
  /formats/X.509.md
  /formats/File-Formats.md
  /formats/ASN.1-DER.md
  /formats/Encoding.md
  /learn/
  /history/
  /protocols/PKI.md
  /protocols/TLS-1.3.md
  /protocols/SSH.md
  /protocols/IPsec.md
  /protocols/WireGuard.md
  /protocols/Wi-Fi.md
  /protocols/DNSSEC.md
  /protocols/TOTP.md
  /protocols/Kerberos.md
  /protocols/FIDO2.md
  /protocols/JWT.md
  /protocols/OpenPGP.md
  /protocols/S-MIME.md
  /protocols/Signal.md
  /protocols/MLS.md
  /protocols/age.md
  /protocols/Disk-Encryption.md
  /protocols/Bitcoin.md

